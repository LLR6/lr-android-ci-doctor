name: Test
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: CLI version smoke test
        run: android-ci-doctor --version
      - run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q src
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Validate JSON Schemas
        shell: bash
        run: |
          if compgen -G "schemas/*.json" > /dev/null; then
            for f in schemas/*.json; do python -m json.tool "$f" > /dev/null; done
          fi
      - name: Evaluate example logs
        run: python scripts/evaluate_examples.py benchmarks/examples.json --output example-benchmark.json --fail-on-regression
      - name: Hash example benchmark
        run: sha256sum example-benchmark.json > example-benchmark.json.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-doctor-example-benchmark-${{ matrix.python-version }}
          path: |
            example-benchmark.json
            example-benchmark.json.sha256
