name: Test
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Check release metadata consistency
        run: python scripts/check_release_metadata.py
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Compile package
        run: python -m compileall -q src/ci_doctor
      - name: Smoke-test installed CLI
        run: android-ci-doctor --help > /dev/null
      - run: python -m pip install "jsonschema>=4.23"
      - name: CLI version smoke test
        run: android-ci-doctor --version
      - run: python -m unittest discover -s tests -v
      - name: Coverage snapshot
        run: |
          python -m pip install "coverage>=7.6"
          coverage run --source=src/ci_doctor -m unittest discover -s tests -v
          coverage report -m --fail-under=50
          coverage xml -o coverage.xml
      - name: Compile package
        run: python -m compileall -q src
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Validate JSON Schemas
        shell: bash
        run: |
          if compgen -G "schemas/*.json" > /dev/null; then
            for f in schemas/*.json; do python -m json.tool "$f" > /dev/null; done
          fi
      - name: Evaluate example logs
        run: python scripts/evaluate_examples.py benchmarks/examples.json --output example-benchmark.json --fail-on-regression
      - name: Build CI Doctor JSON report
        run: android-ci-doctor examples/build.log --format json > ci-doctor-report.json
      - name: Validate CI Doctor report schema
        run: python scripts/validate_json_schema.py schemas/report.schema.json ci-doctor-report.json
      - name: Hash example benchmark
        run: sha256sum example-benchmark.json > example-benchmark.json.sha256
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/lr-wheel-smoke
          /tmp/lr-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/lr-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/lr-wheel-smoke/bin/android-ci-doctor --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-doctor-example-benchmark-${{ matrix.python-version }}
          path: |
            example-benchmark.json
            example-benchmark.json.sha256
