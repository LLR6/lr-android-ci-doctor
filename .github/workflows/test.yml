name: Test
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: CLI version smoke test
        run: android-ci-doctor --version
      - run: python -m unittest discover -s tests -v
      - name: Evaluate example logs
        run: python scripts/evaluate_examples.py benchmarks/examples.json --output example-benchmark.json --fail-on-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-doctor-example-benchmark-${{ matrix.python-version }}
          path: example-benchmark.json
