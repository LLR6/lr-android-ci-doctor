[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-android-ci-doctor"
version = "0.1.0"
description = "Offline evidence-first triage for Android Gradle and GitHub Actions logs"
requires-python = ">=3.10"

[project.scripts]
android-ci-doctor = "ci_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
